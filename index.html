<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>불가항력적 은혜 - 플레이어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; touch-action: none; font-family: 'Malgun Gothic', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .hidden-safe { display: none !important; }
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px #fbbf24; }
            50% { text-shadow: 0 0 30px #f59e0b, 0 0 40px #ef4444; }
            100% { text-shadow: 0 0 10px #fbbf24; }
        }
        .text-glow { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body class="text-white select-none">

    <!-- 로그인 (학생 이름 입력) 화면 -->
    <div id="login-view" class="absolute inset-0 flex flex-col items-center justify-center z-40 bg-gray-900 p-6">
        <h1 class="text-4xl font-black mb-10 text-yellow-400 text-glow">불가항력적 은혜</h1>
        
        <div class="w-full max-w-sm flex flex-col items-center">
            <label class="text-gray-400 mb-2 font-bold">나의 이름은?</label>
            <input type="text" id="player-name" class="w-full px-6 py-4 rounded-xl text-black font-bold text-2xl text-center mb-6 focus:outline-none focus:ring-4 focus:ring-yellow-400" placeholder="이름 입력" maxlength="8">
            <button onclick="joinGame()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-2xl rounded-xl shadow-lg transition">입장하기</button>
        </div>

        <div id="loading-msg" class="mt-6 text-yellow-400 animate-pulse hidden-safe">서버에 연결 중입니다...</div>
    </div>

    <!-- 대기 화면 -->
    <div id="waiting-view" class="absolute inset-0 flex flex-col items-center justify-center z-30 bg-gray-900 p-6 hidden-safe text-center">
        <div class="text-6xl mb-6 animate-bounce">❤️</div>
        <h2 class="text-3xl font-bold text-white mb-4">준비 완료!</h2>
        <p class="text-gray-400 text-xl mb-10">목사님이 게임을 시작할 때까지<br>기다려주세요.</p>
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-yellow-500"></div>
    </div>

    <!-- 게임 결과 (사망) 화면 -->
    <div id="dead-view" class="absolute inset-0 flex flex-col items-center justify-center z-30 bg-red-900/90 backdrop-blur-md p-6 hidden-safe text-center">
        <h1 class="text-6xl font-black mb-4 text-yellow-400 text-glow">은혜에 붙잡힘!</h1>
        <p class="text-2xl text-gray-200 mb-2">나의 버틴 시간</p>
        <p id="result-time" class="text-7xl font-black text-white mb-10">0.0초</p>
        <p class="text-gray-300 text-lg">앞의 스크린에서 순위를 확인하세요!<br>잠시 후 대기실로 이동합니다.</p>
    </div>

    <!-- 인게임 UI (오버레이) -->
    <div id="ingame-ui" class="absolute top-0 left-0 w-full p-4 pointer-events-none z-20 hidden-safe flex justify-between">
        <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-600 shadow-lg">
            <span class="text-sm text-gray-400 block font-bold">라운드</span>
            <span class="text-2xl font-black text-blue-400" id="ui-round">1</span>
        </div>
        <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-600 shadow-lg text-right">
            <span class="text-sm text-yellow-200 block font-bold">버틴 시간</span>
            <span class="text-2xl font-black text-yellow-400" id="ui-time">0.0초</span>
        </div>
    </div>

    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas" class="absolute inset-0 z-10 hidden-safe"></canvas>

    <!-- ========================================== -->
    <!-- GM 비밀번호 모달 -->
    <div id="gm-password-modal" class="absolute inset-0 flex items-center justify-center z-[100] bg-black/80 hidden-safe p-6">
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-600 w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold text-white mb-4">관리자 인증</h2>
            <input type="password" id="gm-password-input" class="w-full px-4 py-3 rounded text-black text-center text-xl mb-4" placeholder="비밀번호">
            <div class="flex gap-2">
                <button onclick="hideGmModal()" class="flex-1 py-3 bg-gray-600 rounded font-bold text-white">취소</button>
                <button onclick="checkGmPassword()" class="flex-1 py-3 bg-red-600 rounded font-bold text-white">확인</button>
            </div>
        </div>
    </div>

    <!-- GM 톱니바퀴 (우측 하단 숨김) -->
    <button onclick="showGmModal()" class="absolute bottom-4 right-4 text-gray-800 hover:text-gray-600 z-50 p-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>

    <!-- GM 컨트롤 뷰 -->
    <div id="gm-view" class="absolute inset-0 bg-gray-900 p-6 hidden-safe z-[60] overflow-y-auto">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-black text-red-400">👑 진행자 패널</h1>
            <button onclick="closeGmView()" class="px-4 py-2 bg-gray-700 rounded font-bold">닫기</button>
        </div>
        
        <div class="bg-gray-800 p-6 rounded-xl mb-6 shadow-lg border border-gray-600">
            <h2 class="text-xl font-bold mb-4 text-gray-300">게임 통제</h2>
            <div class="flex items-center gap-4 mb-6">
                <span class="text-lg">진행할 라운드:</span>
                <input type="number" id="gm-round-input" value="1" min="1" class="w-24 p-3 text-black font-bold text-center text-xl rounded">
            </div>
            
            <div class="p-4 rounded mb-6 text-center border-2 border-gray-700" id="gm-status-box">
                <p id="gm-status-text" class="font-bold text-2xl text-yellow-400">상태: 대기 중 ⏳</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="gmStartRound()" class="p-4 bg-green-600 hover:bg-green-500 rounded font-bold text-xl shadow">▶️ 라운드 시작</button>
                <button onclick="gmEndRound()" class="p-4 bg-yellow-600 hover:bg-yellow-500 rounded font-bold text-xl shadow">⏹️ 라운드 강제종료</button>
            </div>
        </div>

        <div class="bg-red-900/30 p-6 rounded-xl border border-red-800 mt-8">
            <h2 class="text-xl font-bold mb-4 text-red-400">데이터 관리</h2>
            <button onclick="gmClearLeaderboard()" class="w-full p-4 bg-red-700 hover:bg-red-600 rounded font-bold text-lg shadow">🗑️ 전체 랭킹 기록 삭제</button>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'grace-game-v2';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey":"dummy"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STATE_PATH = `artifacts/${appId}/public/data/gamestate`;
        const LEADERBOARD_PATH = `artifacts/${appId}/public/data/leaderboard`;

        let currentUser = null;
        let globalState = { status: 'waiting', currentRound: 1, startTime: 0 };
        
        let myName = "";
        let isAlive = false;
        let survivedTime = 0;
        let isGmMode = false;
        let currentPlayId = 0; // 게임 시작 타이밍 완벽 동기화용 변수

        async function initAuth() {
            document.getElementById('loading-msg').classList.remove('hidden-safe');
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth Error", error); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loading-msg').classList.add('hidden-safe');
                setupStateListener();
            }
        });
        initAuth();

        function setupStateListener() {
            onSnapshot(doc(db, STATE_PATH, 'main'), (docSnap) => {
                if (docSnap.exists()) {
                    globalState = docSnap.data();
                    handleStateChange();
                } else {
                    setDoc(doc(db, STATE_PATH, 'main'), { status: 'waiting', currentRound: 1, startTime: 0 });
                }
            }, e => console.error(e));
        }

        function handleStateChange() {
            // 1. GM 화면 UI 업데이트
            if(isGmMode) {
                document.getElementById('gm-round-input').value = globalState.currentRound;
                const statusBox = document.getElementById('gm-status-box');
                const statusText = document.getElementById('gm-status-text');
                if (globalState.status === 'playing') {
                    statusBox.className = "p-4 rounded mb-6 text-center border-2 border-green-500 bg-green-900/30";
                    statusText.className = "font-bold text-2xl text-green-400";
                    statusText.innerText = "상태: 게임 진행 중 🏃";
                } else {
                    statusBox.className = "p-4 rounded mb-6 text-center border-2 border-gray-700 bg-gray-800";
                    statusText.className = "font-bold text-2xl text-yellow-400";
                    statusText.innerText = "상태: 대기 중 ⏳";
                }
            }

            // 2. 플레이어 화면 제어 로직 (버그 수정됨)
            if (myName !== "") {
                document.getElementById('ui-round').innerText = globalState.currentRound;
                
                if (globalState.status === 'playing') {
                    // 새로운 게임 ID(startTime)가 감지되면 무조건 시작
                    if (currentPlayId !== globalState.startTime) {
                        currentPlayId = globalState.startTime;
                        startLocalGame();
                    }
                } else {
                    // 대기 상태로 전환될 때
                    if (isAlive) endLocalGame(true); // 강제 종료
                    resetToWaiting();
                }
            }
        }

        window.joinGame = function() {
            const input = document.getElementById('player-name').value.trim();
            if(!input) return;
            myName = input;
            
            document.getElementById('login-view').classList.add('hidden-safe');
            initCanvas();

            // 접속 시 이미 게임이 진행 중이라면 즉시 합류
            if (globalState.status === 'playing') {
                currentPlayId = globalState.startTime;
                startLocalGame();
            } else {
                document.getElementById('waiting-view').classList.remove('hidden-safe');
            }
        };

        function resetToWaiting() {
            document.getElementById('gameCanvas').classList.add('hidden-safe');
            document.getElementById('ingame-ui').classList.add('hidden-safe');
            
            // 만약 죽어서 결과 화면을 보고 있다면 덮어씌우지 않음
            if(!document.getElementById('dead-view').classList.contains('hidden-safe')) {
                return;
            }
            document.getElementById('waiting-view').classList.remove('hidden-safe');
        }

        // ================== 캔버스/게임 로직 ==================
        let canvas, ctx, width, height;
        let playerObj = { x: 0, y: 0, vx: 0, vy: 0, radius: 25, emoji: '❤️' };
        let graceObj = { x: 0, y: 0, radius: 40, basePull: 0.1, currentPull: 0.1, sizeMultiplier: 1 };
        let dragSensitivity = 0.2, friction = 0.90;
        let lastTouchX = null, lastTouchY = null, isMouseDown = false;
        let animFrameId = null;

        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            const handleMove = (x, y) => {
                if(!isAlive) return;
                if (lastTouchX !== null && lastTouchY !== null) {
                    playerObj.vx += (x - lastTouchX) * dragSensitivity;
                    playerObj.vy += (y - lastTouchY) * dragSensitivity;
                }
                lastTouchX = x; lastTouchY = y;
            };

            window.addEventListener('touchstart', e => { lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; }, {passive: false});
            window.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
            window.addEventListener('touchend', () => { lastTouchX = null; lastTouchY = null; });
            
            window.addEventListener('mousedown', e => { isMouseDown = true; lastTouchX = e.clientX; lastTouchY = e.clientY; });
            window.addEventListener('mousemove', e => { if(isMouseDown) handleMove(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => { isMouseDown = false; lastTouchX = null; lastTouchY = null; });
        }

        function startLocalGame() {
            document.getElementById('waiting-view').classList.add('hidden-safe');
            document.getElementById('dead-view').classList.add('hidden-safe');
            document.getElementById('ingame-ui').classList.remove('hidden-safe');
            document.getElementById('gameCanvas').classList.remove('hidden-safe');
            
            isAlive = true;
            survivedTime = 0;
            
            playerObj.x = width * 0.1; playerObj.y = height * 0.1;
            playerObj.vx = 0; playerObj.vy = 0;
            graceObj.x = width / 2; graceObj.y = height / 2;
            
            let round = globalState.currentRound;
            graceObj.basePull = 0.1 + (round * 0.05);
            dragSensitivity = Math.max(0.05, 0.2 - (round * 0.02)); 
            
            if(animFrameId) cancelAnimationFrame(animFrameId);
            gameLoop();
        }

        function gameLoop() {
            if (!isAlive || globalState.status !== 'playing') return;

            let elapsedTime = (Date.now() - globalState.startTime) / 1000;
            survivedTime = elapsedTime;
            document.getElementById('ui-time').innerText = survivedTime.toFixed(1) + "초";

            let roundMultiplier = 1 + (globalState.currentRound * 0.2);
            graceObj.currentPull = graceObj.basePull + (elapsedTime * 0.05 * roundMultiplier);
            graceObj.sizeMultiplier = 1 + (elapsedTime * 0.1 * roundMultiplier);

            let dx = playerObj.x - graceObj.x;
            let dy = playerObj.y - graceObj.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 0) {
                playerObj.vx -= (dx / dist) * graceObj.currentPull;
                playerObj.vy -= (dy / dist) * graceObj.currentPull;
            }

            playerObj.vx *= friction; playerObj.vy *= friction;
            playerObj.x += playerObj.vx; playerObj.y += playerObj.vy;

            if (playerObj.x < playerObj.radius) { playerObj.x = playerObj.radius; playerObj.vx *= -0.5; }
            if (playerObj.x > width - playerObj.radius) { playerObj.x = width - playerObj.radius; playerObj.vx *= -0.5; }
            if (playerObj.y < playerObj.radius) { playerObj.y = playerObj.radius; playerObj.vy *= -0.5; }
            if (playerObj.y > height - playerObj.radius) { playerObj.y = height - playerObj.radius; playerObj.vy *= -0.5; }

            let currentGraceRadius = graceObj.radius * graceObj.sizeMultiplier;
            if (dist < playerObj.radius + currentGraceRadius * 0.4) {
                endLocalGame(false);
                return;
            }

            ctx.fillStyle = '#1a202c'; ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(graceObj.x, graceObj.y);
            let gSize = graceObj.radius * graceObj.sizeMultiplier;
            let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, gSize * 2);
            grad.addColorStop(0, 'rgba(253, 224, 71, 0.8)'); grad.addColorStop(0.5, 'rgba(234, 179, 8, 0.3)'); grad.addColorStop(1, 'rgba(234, 179, 8, 0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, gSize * 2, 0, Math.PI * 2); ctx.fill();
            ctx.font = `${gSize * 1.5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 30; ctx.fillText('✝️', 0, 0);
            ctx.restore();

            ctx.save();
            ctx.translate(playerObj.x, playerObj.y);
            if(Math.abs(playerObj.vx) > 1 || Math.abs(playerObj.vy) > 1) {
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-playerObj.vx * 2, -playerObj.vy * 2);
                ctx.strokeStyle = 'rgba(255, 99, 132, 0.5)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
            }
            ctx.font = `${playerObj.radius * 2}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(playerObj.emoji, 0, 0);
            ctx.restore();

            animFrameId = requestAnimationFrame(gameLoop);
        }

        async function endLocalGame(isForced) {
            isAlive = false;
            document.getElementById('gameCanvas').classList.add('hidden-safe');
            document.getElementById('ingame-ui').classList.add('hidden-safe');
            
            if(!isForced && currentUser) {
                try {
                    await addDoc(collection(db, LEADERBOARD_PATH), {
                        name: myName,
                        time: survivedTime,
                        round: globalState.currentRound,
                        timestamp: Date.now()
                    });
                } catch(e) { console.error("기록 저장 실패", e); }
                
                document.getElementById('result-time').innerText = survivedTime.toFixed(1) + "초";
                document.getElementById('dead-view').classList.remove('hidden-safe');
                
                setTimeout(() => {
                    document.getElementById('dead-view').classList.add('hidden-safe');
                    if(globalState.status === 'waiting') {
                        document.getElementById('waiting-view').classList.remove('hidden-safe');
                    }
                }, 5000);
            }
        }

        // ================== GM 제어 ==================
        window.showGmModal = () => {
            document.getElementById('gm-password-input').value = '';
            document.getElementById('gm-password-modal').classList.remove('hidden-safe');
        };
        window.hideGmModal = () => document.getElementById('gm-password-modal').classList.add('hidden-safe');
        
        window.checkGmPassword = () => {
            if(document.getElementById('gm-password-input').value === '1004') {
                hideGmModal();
                isGmMode = true;
                document.getElementById('gm-view').classList.remove('hidden-safe');
                handleStateChange(); 
            } else {
                alert("비밀번호가 틀렸습니다.");
                hideGmModal();
            }
        };
        window.closeGmView = () => {
            isGmMode = false;
            document.getElementById('gm-view').classList.add('hidden-safe');
        };

        window.gmStartRound = async () => {
            if (!currentUser) return;
            const round = parseInt(document.getElementById('gm-round-input').value) || 1;
            await setDoc(doc(db, STATE_PATH, 'main'), {
                status: 'playing',
                currentRound: round,
                startTime: Date.now() // 이 값이 변경되어야 모든 클라이언트가 시작을 인지함
            });
        };

        window.gmEndRound = async () => {
            if (!currentUser) return;
            await setDoc(doc(db, STATE_PATH, 'main'), {
                status: 'waiting',
                currentRound: globalState.currentRound,
                startTime: 0
            }, { merge: true });
        };

        window.gmClearLeaderboard = async () => {
            document.getElementById('gm-view').innerHTML += `
                <div id="clear-confirm" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[100]">
                    <p class="text-white text-2xl font-bold mb-8">모든 랭킹 기록을 삭제합니까?</p>
                    <div class="flex gap-4">
                        <button onclick="executeClear()" class="px-8 py-4 bg-red-600 rounded font-bold text-white">삭제</button>
                        <button onclick="document.getElementById('clear-confirm').remove()" class="px-8 py-4 bg-gray-600 rounded font-bold text-white">취소</button>
                    </div>
                </div>
            `;
        };

        window.executeClear = async () => {
            document.getElementById('clear-confirm').remove();
            if (!currentUser) return;
            const snapshot = await getDocs(collection(db, LEADERBOARD_PATH));
            const promises = [];
            snapshot.forEach(d => promises.push(deleteDoc(doc(db, LEADERBOARD_PATH, d.id))));
            await Promise.all(promises);
        };
    </script>
</body>
</html>
