<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>불가항력적 은혜</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0f172a; color: white;
            overflow: hidden; width: 100vw; height: 100vh;
            touch-action: none; user-select: none;
        }
        .screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 1.2rem; padding: 2rem;
        }
        .screen.hidden { display: none; }

        /* ── 입장 화면 ── */
        #name-screen { background: linear-gradient(160deg,#0f172a 0%,#1e1b4b 100%); z-index:100; }
        .logo { font-size:5.5rem; font-weight:900; color:#eab308;
            text-shadow:0 0 40px rgba(234,179,8,0.6); letter-spacing:-3px; line-height:1; }
        .logo-sub { font-size:1.2rem; font-weight:700; color:#475569; margin-top:-0.5rem; }
        #name-input {
            width:100%; max-width:300px; padding:1rem 1.2rem; font-size:1.4rem;
            font-family:'Noto Sans KR',sans-serif; background:#1e293b;
            border:2px solid #334155; border-radius:1rem; color:white;
            text-align:center; outline:none;
        }
        #name-input:focus { border-color:#eab308; box-shadow:0 0 0 3px rgba(234,179,8,0.15); }
        #join-btn {
            width:100%; max-width:300px; padding:1rem;
            font-size:1.2rem; font-weight:900; font-family:'Noto Sans KR',sans-serif;
            background:linear-gradient(135deg,#eab308,#f59e0b);
            color:#0f172a; border:none; border-radius:1rem; cursor:pointer;
        }
        #join-btn:active { transform:scale(0.97); }
        #gm-gear-btn {
            background:none; border:none; cursor:pointer;
            color:#1e293b; font-size:1.4rem; margin-top:-0.3rem;
            transition:color 0.2s, transform 0.3s; padding:0.3rem;
        }
        #gm-gear-btn:hover { color:#334155; transform:rotate(60deg); }

        /* ── GM 비번 모달 ── */
        #pw-modal {
            position:fixed; inset:0; background:rgba(0,0,0,0.88);
            display:none; align-items:center; justify-content:center;
            z-index:300; backdrop-filter:blur(6px);
        }
        #pw-modal.visible { display:flex; }
        .pw-box {
            background:#1e293b; border:1px solid #334155; border-radius:1.5rem;
            padding:2rem 1.8rem; width:280px;
            display:flex; flex-direction:column; gap:1rem; align-items:center; text-align:center;
        }
        .pw-title { font-size:1rem; font-weight:700; color:#94a3b8; }
        #pw-input {
            width:100%; padding:0.8rem; font-size:1.8rem;
            font-family:'Noto Sans KR',sans-serif; background:#0f172a;
            border:2px solid #334155; border-radius:0.8rem; color:white;
            text-align:center; outline:none; letter-spacing:0.4em;
        }
        #pw-input:focus { border-color:#eab308; }
        .pw-btns { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; width:100%; }
        .pw-confirm { padding:0.7rem; font-size:1rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif; background:#eab308;
            color:#0f172a; border:none; border-radius:0.6rem; cursor:pointer; }
        .pw-cancel { padding:0.7rem; font-size:1rem; font-weight:700;
            font-family:'Noto Sans KR',sans-serif; background:#1e293b;
            color:#64748b; border:1px solid #334155; border-radius:0.6rem; cursor:pointer; }
        #pw-error { font-size:0.8rem; color:#ef4444; min-height:0.9rem; }

        /* ── GM 화면 ── */
        #gm-screen {
            background:#0d1526; z-index:200;
            justify-content:flex-start; padding:0; overflow-y:auto;
        }
        .gm-header {
            width:100%; padding:1.2rem 1.5rem; flex-shrink:0;
            background:#0f172a; border-bottom:1px solid #1e293b;
            display:flex; align-items:center; justify-content:space-between;
        }
        .gm-header-title { font-size:1.3rem; font-weight:900; color:#eab308; }
        .gm-header-sub   { font-size:0.75rem; color:#475569; margin-top:1px; }
        .gm-body { width:100%; padding:1.2rem; display:flex; flex-direction:column; gap:1.2rem; }

        .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:0.6rem; }
        .stat-card { background:#1e293b; border-radius:0.8rem; padding:0.8rem; text-align:center; }
        .stat-num { font-size:2rem; font-weight:900; }
        .stat-lbl { font-size:0.7rem; color:#64748b; margin-top:1px; }

        .section-label {
            font-size:0.7rem; font-weight:700; color:#475569;
            letter-spacing:0.1em; text-transform:uppercase;
            border-bottom:1px solid #1e293b; padding-bottom:0.4rem;
        }

        .phase-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:0.5rem; }
        .phase-btn {
            padding:0.65rem 0; font-size:0.85rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif; background:#1e293b;
            color:#475569; border:1px solid #334155; border-radius:0.7rem; cursor:pointer;
            transition:all 0.15s;
        }
        .phase-btn.active { color:#0f172a; border-color:transparent; }
        .phase-btn:active { transform:scale(0.95); }

        #gm-phase-info {
            padding:0.65rem 1rem; background:#0f172a; border-radius:0.7rem;
            font-size:0.9rem; font-weight:700; transition:color 0.4s;
        }

        .action-row { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
        .btn-start { padding:0.9rem; font-size:1rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif;
            background:linear-gradient(135deg,#16a34a,#15803d);
            color:white; border:none; border-radius:0.8rem; cursor:pointer; }
        .btn-reset { padding:0.9rem; font-size:1rem; font-weight:700;
            font-family:'Noto Sans KR',sans-serif; background:#1e293b;
            color:#64748b; border:1px solid #334155; border-radius:0.8rem; cursor:pointer; }
        .btn-start:active,.btn-reset:active { transform:scale(0.97); }

        .player-list { display:flex; flex-direction:column; gap:0.4rem; max-height:260px; overflow-y:auto; }
        .player-list::-webkit-scrollbar { width:3px; }
        .player-list::-webkit-scrollbar-thumb { background:#334155; border-radius:2px; }
        .player-item {
            display:flex; align-items:center; gap:0.6rem;
            padding:0.5rem 0.8rem; background:#1e293b; border-radius:0.5rem;
            font-size:0.9rem; transition:opacity 0.3s;
        }
        .player-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .player-name { flex:1; font-weight:700; }
        .player-status { font-size:0.75rem; color:#475569; }
        .player-item.elim { opacity:0.45; }
        .player-item.elim .player-name { text-decoration:line-through; color:#64748b; }

        /* ── 대기실 ── */
        #lobby-screen { background:linear-gradient(160deg,#0f172a 0%,#1e1b4b 100%); z-index:90; }
        .lobby-cross { font-size:3rem; color:#334155; animation:cpulse 2s ease-in-out infinite; }
        @keyframes cpulse { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }

        /* ── 게임 캔버스 ── */
        #game-canvas { display:none; position:fixed; inset:0; width:100%; height:100%; }
        #game-canvas.visible { display:block; }

        #phase-banner {
            position:fixed; top:1rem; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.8); border:1.5px solid #334155;
            border-radius:2rem; padding:0.4rem 1.3rem;
            font-size:0.9rem; font-weight:700; backdrop-filter:blur(10px);
            z-index:50; display:none; white-space:nowrap;
            transition:color 0.5s,border-color 0.5s;
        }
        #swipe-hint {
            position:fixed; bottom:1.5rem; left:0; right:0;
            text-align:center; z-index:50; pointer-events:none;
            font-size:0.8rem; color:rgba(255,255,255,0.35); display:none;
        }

        /* ── 탈락 화면 ── */
        #eliminated-screen { background:radial-gradient(circle at center,#1c0a00 0%,#0f172a 100%); z-index:200; }
        .elim-icon { font-size:4.5rem; animation:eglow 2s ease-in-out infinite alternate; }
        @keyframes eglow { from{filter:drop-shadow(0 0 8px #eab308)} to{filter:drop-shadow(0 0 35px #fef08a)} }
        .elim-title { font-size:2.5rem; font-weight:900; color:#fef08a; text-align:center; }
        .elim-sub { font-size:1rem; color:rgba(255,255,255,0.75); text-align:center; line-height:1.7; }
        .elim-verse {
            padding:1rem 1.5rem; border:1px solid rgba(234,179,8,0.25);
            border-radius:1rem; background:rgba(234,179,8,0.07);
            font-size:0.9rem; color:#fde68a; text-align:center; line-height:1.6;
        }
    </style>
</head>
<body>

<!-- ① 메인 입장 화면 -->
<div id="name-screen" class="screen">
    <div class="logo">TULIP</div>
    <div class="logo-sub">불가항력적 은혜</div>
    <p style="color:#334155;font-size:0.85rem;text-align:center;line-height:1.7;">
        십자가가 당신을 끌어당깁니다<br>스와이프로 버텨보세요!
    </p>
    <input id="name-input" type="text" placeholder="이름 입력 (최대 5자)" maxlength="5" autocomplete="off" autocorrect="off">
    <button id="join-btn">입장하기</button>
    <button id="gm-gear-btn" title="GM 입장">⚙</button>
</div>

<!-- GM 비번 모달 -->
<div id="pw-modal">
    <div class="pw-box">
        <div class="pw-title">⚙ GM 입장</div>
        <input id="pw-input" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
        <div id="pw-error"></div>
        <div class="pw-btns">
            <button class="pw-confirm" id="pw-confirm">확인</button>
            <button class="pw-cancel"  id="pw-cancel">취소</button>
        </div>
    </div>
</div>

<!-- ② GM 화면 -->
<div id="gm-screen" class="screen hidden">
    <div class="gm-header">
        <div>
            <div class="gm-header-title">⚙ GM 제어판</div>
            <div class="gm-header-sub">불가항력적 은혜 — TULIP</div>
        </div>
        <button onclick="exitGM()" style="background:none;border:none;color:#475569;font-size:1.4rem;cursor:pointer;line-height:1;">✕</button>
    </div>
    <div class="gm-body">
        <div class="stat-row">
            <div class="stat-card"><div class="stat-num" id="gm-total" style="color:#60a5fa;">0</div><div class="stat-lbl">접속</div></div>
            <div class="stat-card"><div class="stat-num" id="gm-alive" style="color:#4ade80;">0</div><div class="stat-lbl">생존</div></div>
            <div class="stat-card"><div class="stat-num" id="gm-elim"  style="color:#facc15;">0</div><div class="stat-lbl">사로잡힘</div></div>
        </div>

        <div class="section-label">단계 선택</div>
        <div class="phase-grid">
            <button class="phase-btn" id="gpb1" onclick="setPhase(1)">1단계</button>
            <button class="phase-btn" id="gpb2" onclick="setPhase(2)">2단계</button>
            <button class="phase-btn" id="gpb3" onclick="setPhase(3)">3단계</button>
            <button class="phase-btn" id="gpb4" onclick="setPhase(4)">4단계</button>
            <button class="phase-btn" id="gpb5" onclick="setPhase(5)">5단계</button>
        </div>
        <div id="gm-phase-info" style="color:#475569;">대기 중</div>

        <div class="section-label">게임 제어</div>
        <div class="action-row">
            <button class="btn-start" onclick="startGame()">▶ 게임 시작</button>
            <button class="btn-reset" onclick="resetGame()">↺ 초기화</button>
        </div>

        <div class="section-label">접속 중인 심령</div>
        <div class="player-list" id="gm-player-list">
            <div style="color:#334155;font-size:0.85rem;text-align:center;padding:0.5rem;">아직 없습니다</div>
        </div>
    </div>
</div>

<!-- ③ 대기실 -->
<div id="lobby-screen" class="screen hidden">
    <div class="logo" style="font-size:4rem;">TULIP</div>
    <div class="lobby-cross">✝</div>
    <p id="lobby-greeting" style="color:#eab308;font-size:1.6rem;font-weight:900;"></p>
    <p style="color:#475569;font-size:0.85rem;text-align:center;">선생님이 시작하면<br>자동으로 게임이 시작됩니다</p>
    <p id="lobby-count" style="color:#1e293b;font-size:0.8rem;"></p>
</div>

<!-- ④ 게임 캔버스 -->
<canvas id="game-canvas"></canvas>
<div id="phase-banner">1단계</div>
<div id="swipe-hint">✋ 십자가 반대 방향으로 스와이프!</div>

<!-- ⑤ 탈락 -->
<div id="eliminated-screen" class="screen hidden">
    <div class="elim-icon">✝</div>
    <div class="elim-title">사로잡혔습니다</div>
    <div class="elim-sub">은혜를 이길 수 없었습니다<br>이것이 바로 복음입니다</div>
    <div class="elim-verse">
        "아버지께서 내게 주시는 자는<br>다 내게로 올 것이요"<br>
        <span style="font-size:0.8rem;color:#a78bfa;">— 요한복음 6:37</span>
    </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {
    getFirestore, doc, setDoc, updateDoc, onSnapshot,
    collection, writeBatch, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FB = initializeApp({
    apiKey:"AIzaSyCfyjgtiDVD4Wsd9iGb9tEdrOGFYxxN2Tw",
    authDomain:"kingdomgenius.firebaseapp.com",
    projectId:"kingdomgenius",
    storageBucket:"kingdomgenius.firebasestorage.app",
    messagingSenderId:"385557748196",
    appId:"1:385557748196:web:457b999a38e4982f188ff1"
});
const auth = getAuth(FB);
const db   = getFirestore(FB);
const STATE_REF   = doc(db,'kingdom_genius_games','tulip_ii_room','data','state');
const PLAYERS_COL = collection(db,'kingdom_genius_games','tulip_ii_room','players');
const playerRef   = uid => doc(db,'kingdom_genius_games','tulip_ii_room','players',uid);

const PHASES = [null,
    {pull:0.0005,damp:0.91,crossR:5, elimR:4, color:'#60a5fa',label:'1단계 — 희미한 끌림'},
    {pull:0.0016,damp:0.89,crossR:11,elimR:9, color:'#a78bfa',label:'2단계 — 은혜의 중력'},
    {pull:0.0048,damp:0.87,crossR:20,elimR:16,color:'#f472b6',label:'3단계 — 강렬한 이끌림'},
    {pull:0.0130,damp:0.84,crossR:31,elimR:26,color:'#fb923c',label:'4단계 — 필사적 저항'},
    {pull:0.0900,damp:0.78,crossR:45,elimR:39,color:'#facc15',label:'5단계 — 불가항력!'},
];
const COLORS=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#6366f1','#ec4899','#14b8a6','#84cc16','#f43f5e'];

let myUid=null, myName='', isGM=false;
let gameStatus='lobby', currentPhase=1;
let isEliminated=false, listenersSetup=false;
let pos={x:50,y:50}, vel={x:0,y:0};
let lastTs=null, rafId=null, lastSync=0;
let allPlayers={}, colorIdx=0;

const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize',resize); resize();

// ── 스와이프 ─────────────────────────────────────────
let touchStart=null;
canvas.addEventListener('touchstart',e=>{e.preventDefault();touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:false});
canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    if(!touchStart||isEliminated||gameStatus!=='playing')return;
    applySwipe(e.changedTouches[0].clientX-touchStart.x,e.changedTouches[0].clientY-touchStart.y);
    touchStart=null;
},{passive:false});
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let ms=null;
canvas.addEventListener('mousedown',e=>{ms={x:e.clientX,y:e.clientY};});
canvas.addEventListener('mouseup',e=>{
    if(!ms||isEliminated||gameStatus!=='playing')return;
    applySwipe(e.clientX-ms.x,e.clientY-ms.y); ms=null;
});
function applySwipe(dx,dy){
    const d=Math.sqrt(dx*dx+dy*dy); if(d<8)return;
    const p=Math.min(d/80,1.0)*11;
    vel.x+=dx/d*p; vel.y+=dy/d*p;
    canvas.style.filter='brightness(1.4)';
    setTimeout(()=>{canvas.style.filter='';},80);
}

// ── 게임 루프 ─────────────────────────────────────────
function gameLoop(ts){
    if(!lastTs)lastTs=ts;
    const dt=Math.min((ts-lastTs)/16.67,3); lastTs=ts;
    const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,S=Math.min(W,H);
    const cfg=PHASES[currentPhase];

    ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);

    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,(cfg.crossR/100)*S*2.5);
    g.addColorStop(0,cfg.color+'45'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    if(currentPhase===5){
        const w=(ts/600)%1;
        ctx.save();
        ctx.strokeStyle=`rgba(250,204,21,${0.5-w*0.5})`;
        ctx.lineWidth=3; ctx.shadowBlur=25; ctx.shadowColor='#facc15';
        ctx.beginPath(); ctx.arc(cx,cy,(cfg.crossR/100)*S*0.9+w*S*0.5,0,Math.PI*2); ctx.stroke();
        ctx.restore();
    }

    const cp=(cfg.crossR/100)*S, th=Math.max(cp*0.22,5);
    ctx.save(); ctx.translate(cx,cy);
    ctx.shadowBlur=currentPhase>=4?90:35; ctx.shadowColor=cfg.color;
    ctx.fillStyle=cfg.color;
    ctx.fillRect(-th/2,-cp,th,cp*2);
    ctx.fillRect(-cp*0.65,-th/2,cp*1.3,th);
    ctx.restore();

    if(gameStatus==='playing'&&!isEliminated){
        vel.x+=(50-pos.x)*cfg.pull*dt; vel.y+=(50-pos.y)*cfg.pull*dt;
        const df=Math.pow(cfg.damp,dt); vel.x*=df; vel.y*=df;
        pos.x+=vel.x*dt; pos.y+=vel.y*dt;
        pos.x=Math.max(1,Math.min(99,pos.x)); pos.y=Math.max(1,Math.min(99,pos.y));
        if(Math.sqrt((pos.x-50)**2+(pos.y-50)**2)<cfg.elimR){eliminate();return;}
        const now=Date.now();
        if(now-lastSync>250){ lastSync=now; updateDoc(playerRef(myUid),{x:pos.x,y:pos.y}).catch(()=>{}); }
    }

    if(!isEliminated){
        const px=(pos.x/100)*W, py=(pos.y/100)*H;
        const adx=cx-px,ady=cy-py,ad=Math.sqrt(adx*adx+ady*ady);
        if(ad>40){
            ctx.save(); ctx.translate(px,py); ctx.rotate(Math.atan2(ady,adx));
            ctx.strokeStyle=cfg.color+'55'; ctx.lineWidth=1.5; ctx.setLineDash([4,5]);
            ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(Math.min(ad*0.45,65),0); ctx.stroke();
            ctx.restore();
        }
        ctx.save();
        ctx.shadowBlur=18; ctx.shadowColor='#ef4444';
        ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(px,py+5,9,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fca5a5'; ctx.beginPath(); ctx.arc(px,py-7,6,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        const nw=myName.length*8+14;
        ctx.fillStyle='rgba(0,0,0,0.65)';
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(px-nw/2,py+16,nw,16,4); else ctx.rect(px-nw/2,py+16,nw,16);
        ctx.fill();
        ctx.fillStyle='white'; ctx.font='bold 10px Noto Sans KR';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(myName,px,py+24);
        ctx.restore();
    }
    rafId=requestAnimationFrame(gameLoop);
}

async function eliminate(){
    if(isEliminated)return; isEliminated=true;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    showScreen('eliminated-screen');
    document.getElementById('phase-banner').style.display='none';
    document.getElementById('swipe-hint').style.display='none';
    canvas.classList.remove('visible');
    try{await updateDoc(playerRef(myUid),{eliminated:true,x:50,y:50});}catch(_){}
}

function beginPlay(){
    const angle=Math.random()*Math.PI*2,r=32+Math.random()*10;
    pos={x:50+Math.cos(angle)*r,y:50+Math.sin(angle)*r}; vel={x:0,y:0}; lastTs=null;
    gameStatus='playing';
    showScreen('canvas');
    if(rafId)cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(gameLoop);
}

function showScreen(which){
    ['name-screen','lobby-screen','gm-screen','eliminated-screen'].forEach(id=>{
        document.getElementById(id).classList.add('hidden');
    });
    canvas.classList.remove('visible');
    document.getElementById('phase-banner').style.display='none';
    document.getElementById('swipe-hint').style.display='none';
    if(which==='canvas'){
        canvas.classList.add('visible');
        document.getElementById('phase-banner').style.display='block';
        document.getElementById('swipe-hint').style.display='block';
    } else {
        document.getElementById(which).classList.remove('hidden');
    }
}

function updatePhaseBanner(p){
    const cfg=PHASES[p],b=document.getElementById('phase-banner');
    b.textContent=cfg.label; b.style.color=cfg.color; b.style.borderColor=cfg.color+'50';
}
function updateGMPhaseUI(p){
    const cfg=PHASES[p];
    document.getElementById('gm-phase-info').textContent=cfg.label;
    document.getElementById('gm-phase-info').style.color=cfg.color;
    for(let i=1;i<=5;i++){
        const btn=document.getElementById(`gpb${i}`);
        if(i===p){btn.classList.add('active');btn.style.background=PHASES[i].color;btn.style.borderColor=PHASES[i].color;}
        else{btn.classList.remove('active');btn.style.background='';btn.style.borderColor='';}
    }
}
function renderGMList(){
    const list=document.getElementById('gm-player-list');
    list.innerHTML='';
    const arr=Object.values(allPlayers);
    if(!arr.length){list.innerHTML='<div style="color:#334155;font-size:0.85rem;text-align:center;padding:0.5rem;">아직 없습니다</div>';return;}
    arr.forEach(p=>{
        const div=document.createElement('div');
        div.className='player-item'+(p.eliminated?' elim':'');
        div.innerHTML=`<div class="player-dot" style="background:${p.color}"></div>
            <span class="player-name">${p.name}</span>
            <span class="player-status">${p.eliminated?'✝ 사로잡힘':'생존 중'}</span>`;
        list.appendChild(div);
    });
    const total=arr.length,elim=arr.filter(p=>p.eliminated).length;
    document.getElementById('gm-total').textContent=total;
    document.getElementById('gm-alive').textContent=total-elim;
    document.getElementById('gm-elim').textContent=elim;
}

function setupListeners(){
    if(listenersSetup)return; listenersSetup=true;
    onSnapshot(STATE_REF,snap=>{
        if(!snap.exists())return;
        const d=snap.data();
        const ns=d.gameStatus||'lobby', np=d.phase||1;
        if(np!==currentPhase){
            currentPhase=np; updatePhaseBanner(currentPhase);
            if(isGM)updateGMPhaseUI(currentPhase);
            if(gameStatus==='playing'){canvas.style.filter='brightness(2) saturate(2)';setTimeout(()=>{canvas.style.filter='';},200);}
        }
        if(!isGM){
            if(ns==='playing'&&gameStatus!=='playing'&&!isEliminated){beginPlay();}
            else if(ns==='lobby'&&gameStatus==='playing'&&!isEliminated){
                if(rafId){cancelAnimationFrame(rafId);rafId=null;}
                showScreen('lobby-screen');
            }
        }
        gameStatus=ns;
    });
    onSnapshot(PLAYERS_COL,snap=>{
        const uids=new Set();
        snap.forEach(docSnap=>{
            const uid=docSnap.id,d=docSnap.data(); uids.add(uid);
            if(!allPlayers[uid]) allPlayers[uid]={name:d.name,eliminated:d.eliminated||false,color:COLORS[colorIdx++%COLORS.length]};
            else allPlayers[uid].eliminated=d.eliminated||false;
        });
        Object.keys(allPlayers).forEach(uid=>{ if(!uids.has(uid))delete allPlayers[uid]; });
        if(isGM)renderGMList();
        const lc=document.getElementById('lobby-count');
        if(lc)lc.textContent=`현재 ${snap.size}명 대기 중`;
    });
}

// ── GM 액션 ──────────────────────────────────────────
window.setPhase=async n=>{currentPhase=n;updateGMPhaseUI(n);await updateDoc(STATE_REF,{phase:n});};
window.startGame=async()=>{await setDoc(STATE_REF,{gameStatus:'playing',phase:currentPhase},{merge:true});};
window.resetGame=async()=>{
    if(!confirm('모든 플레이어를 삭제하고 초기화합니다. 계속하시겠습니까?'))return;
    const snap=await getDocs(PLAYERS_COL);
    const batch=writeBatch(db); snap.forEach(d=>batch.delete(d.ref)); await batch.commit();
    await setDoc(STATE_REF,{gameStatus:'lobby',phase:1});
    allPlayers={}; colorIdx=0; currentPhase=1; updateGMPhaseUI(1); renderGMList();
};
window.exitGM=()=>{isGM=false;showScreen('name-screen');};

// ── 비번 모달 ─────────────────────────────────────────
document.getElementById('gm-gear-btn').addEventListener('click',()=>{
    document.getElementById('pw-input').value='';
    document.getElementById('pw-error').textContent='';
    document.getElementById('pw-modal').classList.add('visible');
    setTimeout(()=>document.getElementById('pw-input').focus(),100);
});
document.getElementById('pw-cancel').addEventListener('click',()=>document.getElementById('pw-modal').classList.remove('visible'));
document.getElementById('pw-confirm').addEventListener('click',confirmPW);
document.getElementById('pw-input').addEventListener('keypress',e=>{if(e.key==='Enter')confirmPW();});
function confirmPW(){
    if(document.getElementById('pw-input').value==='1004'){
        document.getElementById('pw-modal').classList.remove('visible');
        isGM=true; currentPhase=1; updateGMPhaseUI(1);
        showScreen('gm-screen');
        setupListeners(); renderGMList();
    } else {
        document.getElementById('pw-error').textContent='비밀번호가 틀렸습니다';
        document.getElementById('pw-input').value='';
        document.getElementById('pw-input').focus();
    }
}

// ── 학생 입장 ─────────────────────────────────────────
document.getElementById('join-btn').addEventListener('click',joinGame);
document.getElementById('name-input').addEventListener('keypress',e=>{if(e.key==='Enter')joinGame();});
async function joinGame(){
    const name=document.getElementById('name-input').value.trim();
    if(!name){document.getElementById('name-input').focus();return;}
    myName=name;
    document.getElementById('lobby-greeting').textContent=`${myName} 님, 준비하세요!`;
    showScreen('lobby-screen');
    const angle=Math.random()*Math.PI*2,r=32+Math.random()*10;
    pos={x:50+Math.cos(angle)*r,y:50+Math.sin(angle)*r};
    await setDoc(playerRef(myUid),{name:myName,x:pos.x,y:pos.y,eliminated:false,joinedAt:serverTimestamp()});
    setupListeners();
}

// ── 인증 ──────────────────────────────────────────────
try{ await signInAnonymously(auth); myUid=auth.currentUser.uid; }catch(e){console.error(e);}
</script>
