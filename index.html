<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>불가항력적 은혜 - 서바이벌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a202c; touch-action: none; font-family: 'Malgun Gothic', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        @keyframes glow {
            0% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24, 0 0 30px #f59e0b; }
            50% { text-shadow: 0 0 20px #fcd34d, 0 0 40px #fbbf24, 0 0 60px #f59e0b; }
            100% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24, 0 0 30px #f59e0b; }
        }
        .text-glow { animation: glow 2s infinite; }
        
        .modal {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="relative text-white select-none">

    <!-- 게임 UI -->
    <div id="ui-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-4 z-10 hidden">
        <div class="flex justify-between items-start">
            <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-600 shadow-lg">
                <h2 class="text-sm text-gray-400 font-bold mb-1">현재 라운드</h2>
                <div class="text-3xl font-black text-blue-400" id="round-display">1</div>
            </div>
            <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-600 shadow-lg text-right">
                <h2 class="text-sm text-yellow-200 font-bold mb-1">버틴 시간</h2>
                <div class="text-3xl font-black text-yellow-400" id="time-display">0.0초</div>
            </div>
        </div>
        
        <div id="instruction" class="text-center mb-8 animate-pulse">
            <p class="text-lg font-bold bg-black/50 inline-block px-4 py-2 rounded-full">
                👆 화면을 <span class="text-red-400">계속 문질러서(스와이프)</span> 도망치세요!<br>
            </p>
        </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="absolute inset-0 modal flex flex-col items-center justify-center z-50 p-6 text-center">
        <h1 class="text-5xl font-black mb-4 text-glow text-yellow-400">끝까지 추적하는 사랑</h1>
        <p class="text-xl mb-8 text-gray-300">
            화면을 계속 스와이프하여 십자가(은혜)를 피하세요!<br>
            오래 버틸수록 순위가 높아집니다.<br>
            <span class="text-red-400 text-sm mt-2 block">* 라운드가 거듭될수록 은혜의 힘이 강해집니다.</span>
        </p>
        
        <div class="mb-6 flex flex-col items-center">
            <label for="player-name" class="text-gray-400 mb-2 font-bold">참가자 이름</label>
            <input type="text" id="player-name" class="px-4 py-2 rounded text-black font-bold text-center w-48 pointer-events-auto" placeholder="이름 입력" value="학생1">
        </div>

        <button id="start-btn" class="px-8 py-4 bg-yellow-500 text-gray-900 font-bold text-2xl rounded-full shadow-[0_0_20px_rgba(234,179,8,0.5)] hover:scale-105 transition transform pointer-events-auto">
            게임 시작
        </button>
    </div>

    <!-- 라운드 결과 화면 -->
    <div id="round-end-screen" class="absolute inset-0 modal flex flex-col items-center justify-center z-50 p-6 text-center hidden">
        <h2 class="text-4xl font-bold text-white mb-2" id="round-end-title">라운드 종료</h2>
        <h1 class="text-6xl font-black mb-6 text-yellow-500 text-glow">은혜에 붙잡힘!</h1>
        
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-600 shadow-xl max-w-md w-full mb-8">
            <h3 class="text-xl text-gray-400 mb-4 font-bold border-b border-gray-600 pb-2">순위표</h3>
            <div id="leaderboard" class="flex flex-col gap-3 text-left">
                <!-- 리더보드 항목이 여기에 추가됨 -->
            </div>
        </div>

        <button id="next-round-btn" class="px-8 py-4 bg-blue-500 text-white font-bold text-2xl rounded-full shadow-[0_0_20px_rgba(59,130,246,0.5)] hover:scale-105 transition transform pointer-events-auto">
            다음 라운드 도전
        </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 게임 상태 및 기록
        let gameState = 'start'; // start, playing, roundEnd
        let currentRound = 1;
        let startTime = 0;
        let survivedTime = 0;
        let playerName = "학생1";
        
        // 리더보드 데이터 (가짜 데이터 포함)
        let leaderboardData = [
            { name: "김은혜", time: 15.2, round: 1 },
            { name: "이믿음", time: 12.5, round: 1 },
            { name: "박소망", time: 9.8, round: 1 },
            { name: "최사랑", time: 5.1, round: 1 }
        ];
        
        // 엔티티
        let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 25, emoji: '❤️' };
        let grace = { x: 0, y: 0, radius: 40, basePull: 0.1, currentPull: 0.1, sizeMultiplier: 1 };

        // 입력 처리 (스와이프/드래그)
        let lastTouchX = null;
        let lastTouchY = null;
        let dragSensitivity = 0.2; 
        const friction = 0.90; // 마찰력

        function handleStart(x, y) {
            lastTouchX = x;
            lastTouchY = y;
        }

        function handleMove(x, y) {
            if (gameState !== 'playing') return;
            if (lastTouchX !== null && lastTouchY !== null) {
                let dx = x - lastTouchX;
                let dy = y - lastTouchY;
                player.vx += dx * dragSensitivity;
                player.vy += dy * dragSensitivity;
            }
            lastTouchX = x;
            lastTouchY = y;
        }

        function handleEnd() {
            lastTouchX = null;
            lastTouchY = null;
        }

        // 이벤트 리스너 등록
        window.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        window.addEventListener('touchend', handleEnd);

        let isMouseDown = false;
        window.addEventListener('mousedown', e => { isMouseDown = true; handleStart(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { if(isMouseDown) handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isMouseDown = false; handleEnd(); });

        // 게임 초기화 및 시작
        function initRound() {
            playerName = document.getElementById('player-name').value || "이름없음";
            
            // 플레이어 초기 위치 (십자가에서 멀리)
            player.x = width * 0.1;
            player.y = height * 0.1;
            player.vx = 0;
            player.vy = 0;
            
            // 은혜(십자가) 초기 위치 (가운데)
            grace.x = width / 2;
            grace.y = height / 2;
            
            // 라운드에 따른 난이도 조절
            // 라운드가 높아질수록 기본 인력이 강해지고, 플레이어의 스와이프 효율은 떨어짐
            grace.basePull = 0.1 + (currentRound * 0.05);
            grace.currentPull = grace.basePull;
            grace.sizeMultiplier = 1;
            dragSensitivity = Math.max(0.05, 0.2 - (currentRound * 0.02)); 

            document.getElementById('round-display').innerText = currentRound;
            
            startTime = Date.now();
            gameState = 'playing';
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('round-end-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('instruction').classList.remove('hidden');
            
            requestAnimationFrame(gameLoop);
        }

        // 게임 루프
        function gameLoop() {
            if (gameState !== 'playing') return;

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function update() {
            let elapsedTime = (Date.now() - startTime) / 1000;
            survivedTime = elapsedTime.toFixed(1);
            document.getElementById('time-display').innerText = survivedTime + "초";

            // 시간에 따른 은혜의 성장 (라운드 배수 적용)
            let roundMultiplier = 1 + (currentRound * 0.2);
            
            if (elapsedTime > 3) document.getElementById('instruction').classList.add('hidden');

            // 십자가가 점점 커지고 강해짐
            grace.currentPull = grace.basePull + (elapsedTime * 0.05 * roundMultiplier);
            grace.sizeMultiplier = 1 + (elapsedTime * 0.1 * roundMultiplier);

            // 거리 계산
            let dxToGrace = player.x - grace.x;
            let dyToGrace = player.y - grace.y;
            let distToGrace = Math.sqrt(dxToGrace*dxToGrace + dyToGrace*dyToGrace);
            
            if (distToGrace > 0) {
                // 은혜의 인력 작용 (플레이어를 당김)
                player.vx -= (dxToGrace / distToGrace) * grace.currentPull;
                player.vy -= (dyToGrace / distToGrace) * grace.currentPull;
            }

            // 플레이어 물리 적용
            player.vx *= friction;
            player.vy *= friction;
            player.x += player.vx;
            player.y += player.vy;

            // 벽 충돌 처리
            if (player.x < player.radius) { player.x = player.radius; player.vx *= -0.5; }
            if (player.x > width - player.radius) { player.x = width - player.radius; player.vx *= -0.5; }
            if (player.y < player.radius) { player.y = player.radius; player.vy *= -0.5; }
            if (player.y > height - player.radius) { player.y = height - player.radius; player.vy *= -0.5; }

            // 충돌(잡힘) 확인
            let currentGraceRadius = grace.radius * grace.sizeMultiplier;
            if (distToGrace < player.radius + currentGraceRadius * 0.4) {
                triggerSalvation();
            }
        }

        function draw() {
            // 배경
            ctx.fillStyle = '#1a202c';
            ctx.fillRect(0, 0, width, height);

            // 은혜(십자가) 그리기 (아래에 그림)
            ctx.save();
            ctx.translate(grace.x, grace.y);
            let gSize = grace.radius * grace.sizeMultiplier;
            
            let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, gSize * 2);
            gradient.addColorStop(0, 'rgba(253, 224, 71, 0.8)');
            gradient.addColorStop(0.5, 'rgba(234, 179, 8, 0.3)');
            gradient.addColorStop(1, 'rgba(234, 179, 8, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, gSize * 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = `${gSize * 1.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 30;
            ctx.fillText('✝️', 0, 0);
            ctx.restore();

            // 플레이어(하트) 그리기 (위에 그림)
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // 이동 방향으로 꼬리(궤적) 효과
            if(Math.abs(player.vx) > 1 || Math.abs(player.vy) > 1) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-player.vx * 2, -player.vy * 2);
                ctx.strokeStyle = 'rgba(255, 99, 132, 0.5)';
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            ctx.font = `${player.radius * 2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player.emoji, 0, 0);
            ctx.restore();
        }

        function triggerSalvation() {
            gameState = 'roundEnd';
            
            // 기록 저장
            leaderboardData.push({
                name: playerName,
                time: parseFloat(survivedTime),
                round: currentRound
            });

            // 순위 정렬 (오래 버틴 순)
            leaderboardData.sort((a, b) => b.time - a.time);

            // 리더보드 UI 업데이트
            const leaderboardEl = document.getElementById('leaderboard');
            leaderboardEl.innerHTML = ''; // 초기화

            leaderboardData.slice(0, 5).forEach((entry, index) => { // 상위 5명만 표시
                let isMe = entry.name === playerName && entry.time === parseFloat(survivedTime);
                let bgColor = isMe ? 'bg-yellow-900/50 border border-yellow-500' : 'bg-gray-700';
                let rankColor = index === 0 ? 'text-yellow-400' : (index === 1 ? 'text-gray-300' : (index === 2 ? 'text-yellow-700' : 'text-gray-500'));
                
                let item = `
                    <div class="flex justify-between items-center p-3 rounded-lg ${bgColor}">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black ${rankColor}">${index + 1}</span>
                            <span class="text-white font-bold text-lg">${entry.name}</span>
                            <span class="text-xs text-gray-400">(${entry.round}R)</span>
                        </div>
                        <span class="text-yellow-400 font-black text-xl">${entry.time.toFixed(1)}초</span>
                    </div>
                `;
                leaderboardEl.innerHTML += item;
            });

            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('round-end-title').innerText = `${currentRound}라운드 종료`;
            document.getElementById('round-end-screen').classList.remove('hidden');
        }

        // 버튼 이벤트
        document.getElementById('start-btn').addEventListener('click', initRound);
        document.getElementById('next-round-btn').addEventListener('click', () => {
            currentRound++;
            initRound();
        });

        // 초기 화면 그리기
        ctx.fillStyle = '#1a202c';
        ctx.fillRect(0, 0, width, height);

    </script>
</body>
</html>
