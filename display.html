<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불가항력적 은혜 - 송출 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { 
            margin: 0; 
            /* 제한적 속죄 테마를 연상시키는 깊고 어두운 그라데이션 배경 */
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden; 
            font-family: 'Noto Sans KR', sans-serif; 
        }
        @keyframes dramatic-pulse {
            0% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); border-color: rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 50px rgba(220, 38, 38, 0.6); border-color: rgba(220, 38, 38, 0.9); }
            100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); border-color: rgba(220, 38, 38, 0.4); }
        }
        .playing-mode { animation: dramatic-pulse 1.5s infinite; }
        
        @keyframes text-glow {
            0% { text-shadow: 0 0 10px #facc15; }
            50% { text-shadow: 0 0 30px #facc15, 0 0 40px #eab308; }
            100% { text-shadow: 0 0 10px #facc15; }
        }
        .title-glow { animation: text-glow 2s infinite; }
        
        /* 스크롤바 숨기기 (더 깔끔한 UI를 위해) */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-white h-screen flex flex-col p-6">

    <!-- 헤더 섹션 (상단) -->
    <header class="flex justify-between items-end pb-4 border-b-2 border-gray-700 mb-6">
        <div>
            <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 title-glow mb-2">
                불가항력적 은혜
            </h1>
            <p class="text-xl text-gray-400 tracking-widest font-bold">IRRESISTIBLE GRACE</p>
        </div>
        <div class="text-right">
            <h2 id="screen-round-title" class="text-5xl font-black text-white">데이터 연결 중...</h2>
        </div>
    </header>

    <!-- 메인 레이아웃 (좌측 상태창 / 우측 리더보드 그리드) -->
    <main class="flex-1 flex gap-6 overflow-hidden">
        
        <!-- 좌측: 상태 표시 패널 (1/3 너비) -->
        <div class="w-1/3 flex flex-col gap-6">
            <div id="status-card" class="flex-1 flex flex-col items-center justify-center p-8 rounded-3xl border-2 border-gray-700 bg-gray-800/80 shadow-2xl transition-all duration-500">
                <div id="status-icon" class="text-9xl mb-8">⏳</div>
                <h3 id="status-title" class="text-4xl font-black text-blue-400 mb-4 text-center">대기 중입니다</h3>
                <p id="status-desc" class="text-2xl text-gray-300 text-center font-bold break-keep">
                    학생들은 스마트폰에서 이름을 입력하고<br>입장한 뒤 대기해주세요.
                </p>
            </div>
            
            <div class="h-48 bg-gray-800/80 rounded-3xl border border-gray-700 p-6 flex flex-col justify-center items-center shadow-lg">
                <p class="text-gray-400 text-xl font-bold mb-2">이번 라운드 탈락자</p>
                <p id="death-count" class="text-6xl font-black text-white">0<span class="text-3xl text-gray-500 ml-2">명</span></p>
            </div>
        </div>

        <!-- 우측: 리더보드 패널 (2/3 너비, 그리드 형태) -->
        <div class="w-2/3 bg-gray-800/60 rounded-3xl border border-gray-700 p-8 shadow-2xl flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-3xl font-black flex items-center gap-3">
                    <span class="text-yellow-400">🏆</span> 생존 랭킹 (오래 버틴 순)
                </h3>
            </div>
            
            <!-- 리더보드 아이템이 다단(Grid)으로 깔끔하게 정렬되는 영역 -->
            <div id="leaderboard-grid" class="flex-1 grid grid-cols-2 auto-rows-max gap-4 overflow-y-auto pb-10">
                <div class="col-span-2 text-center text-gray-500 text-2xl mt-32 font-bold">
                    아직 은혜에 붙잡힌 사람이 없습니다.
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'grace-game-v2';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey":"dummy"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STATE_PATH = `artifacts/${appId}/public/data/gamestate`;
        const LEADERBOARD_PATH = `artifacts/${appId}/public/data/leaderboard`;

        let currentRound = 1;
        let isPlaying = false;
        let leaderboardData = [];

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth Error", error); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) setupListeners();
        });
        initAuth();

        function setupListeners() {
            onSnapshot(doc(db, STATE_PATH, 'main'), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentRound = data.currentRound;
                    isPlaying = data.status === 'playing';
                    updateScreenUI();
                    renderLeaderboard(); 
                }
            });

            onSnapshot(collection(db, LEADERBOARD_PATH), (snapshot) => {
                leaderboardData = [];
                snapshot.forEach(doc => leaderboardData.push({ id: doc.id, ...doc.data() }));
                leaderboardData.sort((a, b) => b.time - a.time);
                renderLeaderboard();
            });
        }

        function updateScreenUI() {
            document.getElementById('screen-round-title').innerHTML = `<span class="text-gray-400 text-3xl mr-2">ROUND</span> ${currentRound}`;
            
            const card = document.getElementById('status-card');
            const icon = document.getElementById('status-icon');
            const title = document.getElementById('status-title');
            const desc = document.getElementById('status-desc');
            
            if (isPlaying) {
                card.className = "flex-1 flex flex-col items-center justify-center p-8 rounded-3xl border-4 bg-red-950/50 playing-mode transition-all duration-500";
                icon.innerText = "🔥";
                title.className = "text-5xl font-black text-red-400 mb-4 text-center title-glow";
                title.innerText = "은혜가 추적 중입니다!";
                desc.className = "text-2xl text-red-200 text-center font-bold break-keep";
                desc.innerHTML = "끝까지 도망치세요!<br>붙잡히면 이 화면에 이름이 새겨집니다.";
            } else {
                card.className = "flex-1 flex flex-col items-center justify-center p-8 rounded-3xl border-2 border-gray-700 bg-gray-800/80 shadow-2xl transition-all duration-500";
                icon.innerText = "⏳";
                title.className = "text-4xl font-black text-blue-400 mb-4 text-center";
                title.innerText = "대기 중입니다";
                desc.className = "text-2xl text-gray-300 text-center font-bold break-keep";
                desc.innerHTML = "학생들은 스마트폰에서 이름을 입력하고<br>입장한 뒤 대기해주세요.";
            }
        }

        function renderLeaderboard() {
            const grid = document.getElementById('leaderboard-grid');
            grid.innerHTML = '';
            
            const currentRoundData = leaderboardData.filter(d => d.round === currentRound);
            document.getElementById('death-count').innerHTML = `${currentRoundData.length}<span class="text-3xl text-gray-500 ml-2">명</span>`;

            if (currentRoundData.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 text-3xl mt-32 font-bold">아직 붙잡힌 사람이 없습니다.</div>';
                return;
            }

            // 최대 상위 60명 렌더링 (2열 그리드라 많이 들어감)
            currentRoundData.slice(0, 60).forEach((entry, index) => {
                let bgStyle = "bg-gray-700/40 border-gray-600";
                let textStyle = "text-white";
                let rankStyle = "text-gray-400";
                
                // 1~3등 특별 강조 (제한적 속죄 스타일)
                if (index === 0) { bgStyle = "bg-yellow-900/40 border-yellow-500"; rankStyle = "text-yellow-400 font-black"; }
                else if (index === 1) { bgStyle = "bg-gray-600/60 border-gray-400"; rankStyle = "text-gray-300 font-black"; }
                else if (index === 2) { bgStyle = "bg-orange-900/40 border-orange-600"; rankStyle = "text-orange-400 font-black"; }

                let item = `
                    <div class="${bgStyle} border rounded-2xl p-4 flex justify-between items-center transform transition duration-300">
                        <div class="flex items-center gap-4 truncate">
                            <span class="text-2xl w-8 text-center ${rankStyle}">${index + 1}</span>
                            <span class="text-2xl font-bold ${textStyle} truncate max-w-[150px]">${entry.name}</span>
                        </div>
                        <span class="text-yellow-400 font-black text-3xl tracking-wide">${entry.time.toFixed(1)}<span class="text-lg text-gray-400 ml-1">초</span></span>
                    </div>
                `;
                grid.innerHTML += item;
            });
        }
    </script>
</body>
</html>
