<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불가항력적 은혜 - 송출 화면</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #0f172a; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        @keyframes glow {
            0% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24; }
            50% { text-shadow: 0 0 20px #fcd34d, 0 0 40px #fbbf24; }
            100% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24; }
        }
        .text-glow { animation: glow 2s infinite; }
    </style>
</head>
<body class="text-white h-screen flex flex-col p-8">

    <div class="text-center mb-8">
        <h1 class="text-7xl font-black text-yellow-400 text-glow mb-4 tracking-wider">불가항력적 은혜</h1>
        <h2 id="screen-round-title" class="text-4xl font-bold text-gray-300">데이터 연결 중...</h2>
    </div>

    <div id="status-banner" class="text-center bg-gray-800 p-8 rounded-3xl mb-8 border-2 border-gray-600 shadow-2xl transition-colors duration-500">
        <p class="text-5xl font-black text-blue-400">학생들은 메인 화면에서 이름을 입력하고 입장해주세요!</p>
    </div>

    <div class="flex-1 bg-gray-800/80 rounded-3xl border border-gray-600 p-10 shadow-2xl flex flex-col overflow-hidden">
        <div class="flex justify-between items-end border-b-2 border-gray-600 pb-6 mb-6">
            <h3 class="text-4xl font-black text-white flex items-center gap-3">
                <span>🏆</span> 현재 라운드 생존 순위
            </h3>
            <span class="text-yellow-400 text-2xl font-bold">버틴 시간 (초)</span>
        </div>
        
        <!-- 랭킹 리스트가 표시될 영역 -->
        <div id="leaderboard-container" class="flex-1 overflow-y-auto flex flex-col gap-4 pr-4 custom-scrollbar">
            <div class="text-center text-gray-500 text-2xl mt-10">아직 잡힌 사람이 없습니다.</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 메인 앱과 동일한 앱 ID 사용
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'grace-game-v2';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey":"dummy"}');
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STATE_PATH = `artifacts/${appId}/public/data/gamestate`;
        const LEADERBOARD_PATH = `artifacts/${appId}/public/data/leaderboard`;

        let currentRound = 1;
        let isPlaying = false;
        let leaderboardData = [];

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth Error", error); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                setupListeners();
            }
        });
        initAuth();

        function setupListeners() {
            // 1. 게임 상태 (라운드, 진행여부) 수신
            onSnapshot(doc(db, STATE_PATH, 'main'), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentRound = data.currentRound;
                    isPlaying = data.status === 'playing';
                    updateScreenUI();
                    renderLeaderboard(); // 라운드가 바뀌면 랭킹도 다시 필터링
                }
            });

            // 2. 리더보드 데이터 수신 (모두 가져와서 JS에서 필터링)
            onSnapshot(collection(db, LEADERBOARD_PATH), (snapshot) => {
                leaderboardData = [];
                snapshot.forEach(doc => leaderboardData.push({ id: doc.id, ...doc.data() }));
                // 내림차순 정렬 (오래 버틴 사람이 위로)
                leaderboardData.sort((a, b) => b.time - a.time);
                renderLeaderboard();
            });
        }

        function updateScreenUI() {
            document.getElementById('screen-round-title').innerText = `현재 라운드 : ${currentRound} R`;
            const banner = document.getElementById('status-banner');
            
            if (isPlaying) {
                banner.className = "text-center bg-red-900/40 p-8 rounded-3xl mb-8 border-4 border-red-500 shadow-[0_0_30px_rgba(239,68,68,0.5)] transition-colors duration-500";
                banner.innerHTML = `<p class="text-6xl font-black text-red-400 animate-pulse">🔥 은혜가 추적 중입니다! 도망치세요! 🔥</p>`;
            } else {
                banner.className = "text-center bg-gray-800 p-8 rounded-3xl mb-8 border-2 border-gray-600 shadow-2xl transition-colors duration-500";
                banner.innerHTML = `<p class="text-5xl font-black text-blue-400">대기 중입니다. 학생들은 화면을 보고 대기해주세요.</p>`;
            }
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '';
            
            // 현재 라운드 데이터만 표시
            const currentRoundData = leaderboardData.filter(d => d.round === currentRound);
            
            if (currentRoundData.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 text-3xl mt-20 font-bold">아직 은혜에 붙잡힌 사람이 없습니다!</div>';
                return;
            }

            // 최대 상위 50명만 렌더링
            currentRoundData.slice(0, 50).forEach((entry, index) => {
                let rankStyle = "text-gray-400 text-3xl";
                let medal = "";
                let bgStyle = "bg-gray-700/50";
                let borderStyle = "border-gray-600";

                if (index === 0) { rankStyle = "text-yellow-400 text-5xl"; medal = "👑"; bgStyle = "bg-yellow-900/30"; borderStyle = "border-yellow-500"; }
                else if (index === 1) { rankStyle = "text-gray-300 text-4xl"; medal = "🥈"; bgStyle = "bg-gray-700"; }
                else if (index === 2) { rankStyle = "text-orange-400 text-4xl"; medal = "🥉"; bgStyle = "bg-orange-900/20"; borderStyle = "border-orange-600"; }

                let item = `
                    <div class="flex justify-between items-center ${bgStyle} p-5 rounded-2xl border ${borderStyle} transform transition-all duration-300 hover:scale-[1.01]">
                        <div class="flex items-center gap-8">
                            <span class="font-black w-16 text-center ${rankStyle}">${index + 1}</span>
                            <span class="text-4xl font-bold text-white">${medal} ${entry.name}</span>
                        </div>
                        <span class="text-yellow-400 font-black text-5xl tracking-widest">${entry.time.toFixed(1)}<span class="text-3xl">초</span></span>
                    </div>
                `;
                container.innerHTML += item;
            });
        }
    </script>
</body>
</html>
