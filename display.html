<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TULIP: 불가항력적 은혜 — 송출</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family:'Noto Sans KR',sans-serif;
            background:#070d1a; color:white;
            overflow:hidden; width:100vw; height:100vh;
        }

        /* ── 레이아웃: 캔버스(왼) + 명단(오) ── */
        #root {
            display:grid;
            grid-template-columns: 1fr 260px;
            height:100vh;
        }

        /* ── 게임 필드 ── */
        #field {
            position:relative; overflow:hidden; background:#070d1a;
        }
        #game-canvas { display:block; width:100%; height:100%; }

        /* 페이즈 텍스트 (하단 중앙) */
        #phase-display {
            position:absolute; bottom:1.8rem; left:50%; transform:translateX(-50%);
            text-align:center; pointer-events:none;
        }
        #phase-label {
            font-size:1.8rem; font-weight:900;
            text-shadow:0 0 20px currentColor;
            transition:color 0.6s; white-space:nowrap;
        }
        #phase-desc { font-size:0.95rem; color:rgba(255,255,255,0.4); margin-top:0.3rem; }

        /* 상단 제목 (왼쪽 필드에 overlay) */
        #field-header {
            position:absolute; top:1.2rem; left:1.5rem;
            pointer-events:none;
        }
        .field-title { font-size:2.2rem; font-weight:900; color:#eab308;
            text-shadow:0 0 30px rgba(234,179,8,0.5); letter-spacing:-1px; }
        .field-sub   { font-size:0.85rem; color:#334155; margin-top:1px; font-weight:400; }

        /* 5단계 황금 플래시 */
        #golden-flash {
            position:absolute; inset:0;
            background:radial-gradient(circle,rgba(250,204,21,0.22) 0%,transparent 70%);
            opacity:0; pointer-events:none; transition:opacity 1.5s ease;
        }
        #golden-flash.active { opacity:1; }

        /* 로비 오버레이 */
        #lobby-overlay {
            position:absolute; inset:0;
            background:rgba(7,13,26,0.90); backdrop-filter:blur(4px);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:0.8rem;
        }
        #lobby-overlay.hidden { display:none; }
        .lobby-logo { font-size:5rem; font-weight:900; color:#eab308;
            text-shadow:0 0 50px rgba(234,179,8,0.4); letter-spacing:-3px; }
        .lobby-msg  { font-size:1.1rem; color:#475569; text-align:center; }
        #lobby-count { font-size:2rem; font-weight:900; color:#1e293b; margin-top:0.3rem; }

        /* ── 오른쪽 명단 패널 ── */
        #sidebar {
            background:#0d1526; border-left:1px solid #0f1e38;
            display:flex; flex-direction:column; overflow:hidden;
        }

        /* 통계 헤더 */
        .sidebar-header {
            padding:1rem 1.2rem; background:#0f172a;
            border-bottom:1px solid #0f1e38; flex-shrink:0;
        }
        .sidebar-title { font-size:1rem; font-weight:900; color:#eab308; margin-bottom:0.6rem; }
        .mini-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:0.4rem; }
        .mini-stat { background:#1e293b; border-radius:0.6rem; padding:0.5rem; text-align:center; }
        .mini-stat-num { font-size:1.4rem; font-weight:900; }
        .mini-stat-lbl { font-size:0.65rem; color:#475569; margin-top:1px; }

        /* 생존 목록 */
        .list-section { flex:1; overflow-y:auto; padding:0.8rem; display:flex; flex-direction:column; gap:0.35rem; }
        .list-section::-webkit-scrollbar { width:3px; }
        .list-section::-webkit-scrollbar-thumb { background:#1e293b; border-radius:2px; }

        .list-label {
            font-size:0.65rem; font-weight:700; color:#334155;
            letter-spacing:0.1em; text-transform:uppercase;
            padding:0.3rem 0; margin-bottom:0.1rem;
            border-bottom:1px solid #0f1e38;
        }

        .player-row {
            display:flex; align-items:center; gap:0.55rem;
            padding:0.45rem 0.7rem; border-radius:0.5rem;
            background:#111827; font-size:0.88rem;
            animation:slideIn 0.25s ease;
        }
        @keyframes slideIn { from{opacity:0;transform:translateX(8px)} to{opacity:1;transform:translateX(0)} }
        .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
        .p-name { flex:1; font-weight:700; }
        .p-badge { font-size:0.7rem; padding:0.15rem 0.45rem; border-radius:0.3rem; font-weight:700; }
        .badge-alive { background:rgba(74,222,128,0.15); color:#4ade80; }
        .badge-elim  { background:rgba(250,204,21,0.12); color:#facc15; font-size:0.65rem; }

        .player-row.elim { opacity:0.5; }
        .player-row.elim .p-name { color:#475569; }

        /* 탈락 구분선 */
        .elim-divider {
            display:flex; align-items:center; gap:0.4rem;
            padding:0.5rem 0.2rem; margin-top:0.2rem;
        }
        .elim-divider-line { flex:1; height:1px; background:#1e293b; }
        .elim-divider-text { font-size:0.65rem; color:#facc15; font-weight:700; }
    </style>
</head>
<body>
<div id="root">

    <!-- 게임 필드 -->
    <div id="field">
        <canvas id="game-canvas"></canvas>
        <div id="golden-flash"></div>

        <div id="field-header">
            <div class="field-title">TULIP</div>
            <div class="field-sub">불가항력적 은혜 — 은혜의 블랙홀</div>
        </div>

        <div id="phase-display">
            <div id="phase-label" style="color:#334155;">대기 중</div>
            <div id="phase-desc">스마트폰을 연결하고 기다려주세요</div>
        </div>

        <div id="lobby-overlay">
            <div class="lobby-logo">✝</div>
            <div class="lobby-msg">선생님이 시작 버튼을 누르면 게임이 시작됩니다</div>
            <div id="lobby-count"></div>
        </div>
    </div>

    <!-- 명단 사이드바 -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">✝ 심령 현황</div>
            <div class="mini-stats">
                <div class="mini-stat"><div class="mini-stat-num" id="s-total" style="color:#60a5fa;">0</div><div class="mini-stat-lbl">접속</div></div>
                <div class="mini-stat"><div class="mini-stat-num" id="s-alive" style="color:#4ade80;">0</div><div class="mini-stat-lbl">생존</div></div>
                <div class="mini-stat"><div class="mini-stat-num" id="s-elim"  style="color:#facc15;">0</div><div class="mini-stat-lbl">사로잡힘</div></div>
            </div>
        </div>

        <div class="list-section" id="player-list">
            <div class="list-label">접속 중인 심령</div>
            <div id="alive-items"></div>
            <div class="elim-divider" id="elim-divider" style="display:none;">
                <div class="elim-divider-line"></div>
                <div class="elim-divider-text">✝ 사로잡힘</div>
                <div class="elim-divider-line"></div>
            </div>
            <div id="elim-items"></div>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FB = initializeApp({
    apiKey:"AIzaSyCfyjgtiDVD4Wsd9iGb9tEdrOGFYxxN2Tw",
    authDomain:"kingdomgenius.firebaseapp.com",
    projectId:"kingdomgenius",
    storageBucket:"kingdomgenius.firebasestorage.app",
    messagingSenderId:"385557748196",
    appId:"1:385557748196:web:457b999a38e4982f188ff1"
});
const auth = getAuth(FB);
const db   = getFirestore(FB);
const STATE_REF   = doc(db,'kingdom_genius_games','tulip_ii_room','data','state');
const PLAYERS_COL = collection(db,'kingdom_genius_games','tulip_ii_room','players');

const PHASES = [null,
    {crossR:5, color:'#60a5fa',label:'1단계 — 희미한 끌림',   desc:'심령들이 자유롭게 움직입니다.'},
    {crossR:11,color:'#a78bfa',label:'2단계 — 은혜의 중력',    desc:'슬슬 끌려오기 시작합니다.'},
    {crossR:20,color:'#f472b6',label:'3단계 — 강렬한 이끌림',  desc:'버티고 있지만 점점 힘들어집니다.'},
    {crossR:31,color:'#fb923c',label:'4단계 — 필사적 저항',    desc:'마지막 힘을 다해 버팁니다!'},
    {crossR:45,color:'#facc15',label:'5단계 — 불가항력!',      desc:'아무도 피할 수 없습니다.'},
];
const COLORS=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#6366f1','#ec4899','#14b8a6','#84cc16','#f43f5e'];

let currentPhase=1, gameStatus='lobby';
let displayPlayers={}, colorIdx=0;

// 5단계 점진적 전환
const PHASE5_DURATION = 22000;
let phase5StartTs = null;
function getCfg(ts){
    if(currentPhase!==5) return PHASES[currentPhase];
    if(!phase5StartTs) phase5StartTs=ts;
    const t=Math.min((ts-phase5StartTs)/PHASE5_DURATION,1.0);
    const e=t*t*t*t;
    const a=PHASES[4],b=PHASES[5];
    return {
        crossR:a.crossR+(b.crossR-a.crossR)*e,
        color: t<0.5?a.color:b.color,
        label: b.label, desc: b.desc,
    };
}

const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){
    const f=document.getElementById('field');
    W=canvas.width=f.clientWidth; H=canvas.height=f.clientHeight;
}
window.addEventListener('resize',resize); resize();

// 별
const STARS=Array.from({length:150},()=>({
    x:Math.random(),y:Math.random(),
    r:Math.random()*1.4+0.3,a:Math.random()*0.5+0.1
}));

// ── 렌더 루프 ─────────────────────────────────────────
function render(ts){
    ctx.fillStyle='#070d1a'; ctx.fillRect(0,0,W,H);

    STARS.forEach(s=>{
        ctx.fillStyle=`rgba(255,255,255,${s.a})`;
        ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill();
    });

    const cfg=getCfg(ts);
    const cx=W/2,cy=H/2,S=Math.min(W,H);
    const cp=(cfg.crossR/100)*S;

    // 글로우
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,cp*2.8);
    g.addColorStop(0,cfg.color+'40'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // 5단계 파동 (점진적)
    if(currentPhase===5){
        const tP=phase5StartTs?Math.min((ts-phase5StartTs)/PHASE5_DURATION,1.0):0;
        const wA=tP*0.55;
        const w=(ts/650)%1;
        ctx.save();
        ctx.strokeStyle=`rgba(250,204,21,${wA-w*wA})`;
        ctx.lineWidth=2+tP*3; ctx.shadowBlur=30*tP; ctx.shadowColor='#facc15';
        ctx.beginPath(); ctx.arc(cx,cy,cp*0.85+w*S*0.52,0,Math.PI*2); ctx.stroke();
        ctx.restore();
    }

    // 십자가
    const th=Math.max(cp*0.20,6);
    ctx.save(); ctx.translate(cx,cy);
    ctx.shadowBlur=currentPhase>=4?120:50; ctx.shadowColor=cfg.color;
    ctx.fillStyle=cfg.color;
    ctx.fillRect(-th/2,-cp,th,cp*2);
    ctx.fillRect(-cp*0.65,-th/2,cp*1.3,th);
    ctx.restore();

    // 플레이어 (Lerp)
    Object.values(displayPlayers).forEach(p=>{
        if(p.eliminated)return;
        p.x+=(p.tx-p.x)*0.10; p.y+=(p.ty-p.y)*0.10;
        const px=(p.x/100)*W, py=(p.y/100)*H;

        ctx.save();
        ctx.shadowBlur=14; ctx.shadowColor=p.color;
        ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(px,py+4,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=p.color+'cc'; ctx.beginPath(); ctx.arc(px,py-6,5.5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        const nw=p.name.length*7.5+12;
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(px-nw/2,py+14,nw,15,4); else ctx.rect(px-nw/2,py+14,nw,15);
        ctx.fill();
        ctx.fillStyle='white'; ctx.font='bold 9.5px Noto Sans KR';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.name,px,py+21.5);
        ctx.restore();
    });

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ── 명단 렌더 ─────────────────────────────────────────
function renderList(){
    const aliveEl=document.getElementById('alive-items');
    const elimEl =document.getElementById('elim-items');
    const divider=document.getElementById('elim-divider');
    aliveEl.innerHTML=''; elimEl.innerHTML='';

    const all=Object.values(displayPlayers);
    const alive=all.filter(p=>!p.eliminated);
    const elim =all.filter(p=>p.eliminated);

    alive.forEach(p=>{
        const div=document.createElement('div');
        div.className='player-row';
        div.innerHTML=`<div class="dot" style="background:${p.color}"></div>
            <span class="p-name">${p.name}</span>
            <span class="p-badge badge-alive">생존</span>`;
        aliveEl.appendChild(div);
    });

    divider.style.display=elim.length?'flex':'none';

    elim.forEach(p=>{
        const div=document.createElement('div');
        div.className='player-row elim';
        div.innerHTML=`<div class="dot" style="background:${p.color}"></div>
            <span class="p-name">${p.name}</span>
            <span class="p-badge badge-elim">✝ 사로잡힘</span>`;
        elimEl.appendChild(div);
    });

    const total=all.length,elimCnt=elim.length;
    document.getElementById('s-total').textContent=total;
    document.getElementById('s-alive').textContent=total-elimCnt;
    document.getElementById('s-elim').textContent=elimCnt;
    document.getElementById('lobby-count').textContent=total?`${total}명 대기 중`:'';
}

// ── Firebase 리스너 ───────────────────────────────────
function setupListeners(){
    onSnapshot(STATE_REF,snap=>{
        if(!snap.exists())return;
        const d=snap.data();
        const ns=d.gameStatus||'lobby', np=d.phase||1;
        currentPhase=np;
        if(np===5) phase5StartTs=null;  // 전환 타이머 리셋

        // 페이즈 표시 업데이트
        const cfg=PHASES[np];
        document.getElementById('phase-label').textContent=cfg.label;
        document.getElementById('phase-label').style.color=cfg.color;
        document.getElementById('phase-desc').textContent=cfg.desc;

        // 5단계 황금 플래시
        const flash=document.getElementById('golden-flash');
        if(np===5)flash.classList.add('active'); else flash.classList.remove('active');

        // 완전 리셋 — 명단 초기화
        if(ns==='reset'){ displayPlayers={}; colorIdx=0; renderList(); }

        // 로비 오버레이
        const overlay=document.getElementById('lobby-overlay');
        if(ns==='playing')overlay.classList.add('hidden'); else overlay.classList.remove('hidden');

        gameStatus=ns;
    });

    onSnapshot(PLAYERS_COL,snap=>{
        const uids=new Set();
        snap.forEach(docSnap=>{
            const uid=docSnap.id,d=docSnap.data(); uids.add(uid);
            if(!displayPlayers[uid]){
                displayPlayers[uid]={
                    name:d.name, x:d.x||50, y:d.y||50,
                    tx:d.x||50, ty:d.y||50,
                    eliminated:d.eliminated||false,
                    color:COLORS[colorIdx++%COLORS.length]
                };
            } else {
                displayPlayers[uid].tx=d.x??displayPlayers[uid].tx;
                displayPlayers[uid].ty=d.y??displayPlayers[uid].ty;
                displayPlayers[uid].eliminated=d.eliminated||false;
            }
        });
        Object.keys(displayPlayers).forEach(uid=>{if(!uids.has(uid))delete displayPlayers[uid];});
        renderList();
    });
}

// ── 인증 ──────────────────────────────────────────────
try{ await signInAnonymously(auth); setupListeners(); }catch(e){console.error(e);}
</script>
</body>
</html>
